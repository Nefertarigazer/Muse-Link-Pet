<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- local-only window: no network, no inline script, no third-party code -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Muse Pet</title>
  <link rel="stylesheet" href="css/pet.css">
</head>
<body>
  <div class="stage" id="stage">
   <div class="rig" id="rig">
    <!-- hover halo: keeps the buttons up while the pointer travels to them -->
    <div class="zone" id="zone"></div>
    <section class="panel" id="panel" hidden></section>
    <section class="panel context-card" id="context-card" hidden></section>
    <div class="bubble" id="bubble" hidden></div>
    <div class="orbs" id="orbs"></div>
    <div class="pet" id="pet" role="button" tabindex="-1" aria-label="Muse Pet" data-i18n-aria-label="pet.accessible">
      <div class="shadow"></div>
      <div class="body" id="body"><div class="frames"></div></div>
    </div>
    <div class="pet-status">
      <span class="busy" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><span class="busy-dot" aria-hidden="true"></span><span class="busy-text" hidden></span></span>
      <span class="alert" aria-hidden="true"></span>
    </div>
    <div class="pet-celebrate">
      <span class="check" aria-hidden="true">
        <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7.5 7.5L37.5 19"/></svg>
      </span>
      <span class="check-label" aria-live="polite" data-i18n="pet.received">Received</span>
    </div>
   </div>
  </div>
  <nav class="demo-bar" id="demo-bar" hidden aria-label="Demo controls" data-i18n-aria-label="pet.demo_controls"></nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
