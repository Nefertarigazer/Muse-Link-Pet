<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- local-only window: no network, no inline script, no third-party code -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title data-i18n="mailbox.title">MuseLink Mailbox</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <!-- the native window is a frameless card: this strip moves it -->
    <div class="drag-strip pywebview-drag-region" aria-hidden="true"></div>
    <div class="winctl" id="winctl" hidden>
      <button id="win-min" type="button" aria-label="Minimize" data-i18n-aria-label="mailbox.minimize" title="Minimize" data-i18n-title="mailbox.minimize"><span class="min"></span></button>
      <button id="win-close" type="button" aria-label="Close to tray" data-i18n-aria-label="mailbox.close_tray" title="Close to tray" data-i18n-title="mailbox.close_tray"><span class="x"></span></button>
    </div>
    <aside class="sidebar" aria-label="Conversations" data-i18n-aria-label="mailbox.conversations">
      <div class="side-head">
        <div class="side-title">
          <h1 data-i18n="mailbox.heading">Mailbox</h1>
          <button class="sync" id="sync" type="button" aria-label="Sync now" data-i18n-aria-label="mailbox.sync_now">
            <span class="dot"></span><span id="sync-label" data-i18n="mailbox.connecting">Connecting</span>
          </button>
        </div>
        <label class="search">
          <span id="search-icon"></span>
          <span class="sr-only" data-i18n="mailbox.search_letters">Search letters</span>
          <input id="search-input" type="search" placeholder="Search" data-i18n-placeholder="mailbox.search" autocomplete="off" spellcheck="false">
          <button class="clear" id="search-clear" type="button" aria-label="Clear search" data-i18n-aria-label="mailbox.clear_search">✕</button>
        </label>
      </div>
      <div class="demo-banner" id="demo-banner" hidden data-i18n="mailbox.demo_banner">Demo data · Local mailbox disconnected</div>
      <nav class="side-list" id="side-list"></nav>
    </aside>
    <main class="content" id="content"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
